name: Publish DevCache to NPM

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0
  workflow_dispatch:  # Allows manual trigger

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        working-directory: ./packages/devcache
        
      - name: Lint code
        run: npm run lint --if-present
        working-directory: ./packages/devcache
        
      - name: Run tests
        run: npm test --if-present
        working-directory: ./packages/devcache
        
      - name: Build package
        run: npm run build
        working-directory: ./packages/devcache
        
      - name: Check build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found"
            exit 1
          fi
          if [ ! -f "dist/cli/index.js" ]; then
            echo "Error: CLI entry point not found"
            exit 1
          fi
          echo "✓ Build output validated"
        working-directory: ./packages/devcache

  publish:
    name: Publish to NPM
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install dependencies
        run: npm install
        working-directory: ./packages/devcache
        
      - name: Build package
        run: npm run build
        working-directory: ./packages/devcache
        
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        
      - name: Update package version
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version
        working-directory: ./packages/devcache
        
      - name: Publish to NPM
        run: npm publish --access public
        working-directory: ./packages/devcache
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## DevCache v${{ steps.version.outputs.VERSION }}
            
            Published to NPM: https://www.npmjs.com/package/devcache
            
            Install: `npm install -g devcache@${{ steps.version.outputs.VERSION }}`
          draft: false
          prerelease: false
